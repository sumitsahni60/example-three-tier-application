name: CI
on: [pull_request]
jobs:
  web-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run lint
  api-check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: node --check index.js && node --check db.js
